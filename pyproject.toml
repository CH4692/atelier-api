[project]
name = "atelier-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Charles Heller", email = "charles.heller@hotmail.de" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.1",
    "pytest>=9.1.1",
]

[tool.fastapi]
entrypoint = "atelier_api.main:app"

[project.scripts]
atelier-api = "atelier_api:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
