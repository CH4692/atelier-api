[project]
name = "atelier-api"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Charles Heller", email = "charles.heller@hotmail.de" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.123",
    "fastapi[standard]>=0.143.1",
    "pillow>=13.0.0",
    "psycopg2>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "pytest>=9.1.1",
    "qrcode>=8.2,<9",
    "sqlmodel>=0.0.48",
]

[tool.fastapi]
entrypoint = "atelier_api.main:app"

[project.scripts]
atelier-api = "atelier_api.cli:main"
atelier-users = "atelier_api.users.cli:main"
atelier-audit-cleanup = "atelier_api.audit.cli:main"
atelier-photos-purge = "atelier_api.photos.purge_cli:main"
atelier-photos-cleanup = "atelier_api.photos.cli:main"
atelier-sessions-cleanup = "atelier_api.auth.cli:main"

[project.optional-dependencies]
build = [
    "uv==0.13.1",
]

[build-system]
requires = ["hatchling==1.33.0", "hatch-vcs==0.5.0", "setuptools-scm==10.3.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/atelier_api"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.123",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "python-semantic-release==10.7.0",
    "ruff>=0.17.1",
    "types-qrcode>=8.2.0.20260518",
]

[tool.mypy]
plugins = ["pydantic.mypy"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: requires a dedicated PostgreSQL TEST_DATABASE_URL"]

[tool.semantic_release]
allow_zero_version = true
major_on_zero = false
commit_parser = "conventional"
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"
version_toml = []
build_command = """
set -eu
python -m pip install --only-binary=:all: 'uv==0.13.1'
rm -rf dist
SETUPTOOLS_SCM_PRETEND_VERSION="$NEW_VERSION" uv build
python scripts/check_release_artifacts.py "$NEW_VERSION"
"""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "docs", "test", "refactor", "chore", "ci"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
other_allowed_tags = ["docs", "test", "refactor", "chore", "ci"]
default_bump_level = 0
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = false

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.semantic_release.remote]
type = "github"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Extend Ruff's existing defaults; validate useful docstrings without requiring
# boilerplate documentation on every module, test or trivial function (D100-D107).
extend-select = [
    "D200", "D205", "D209", "D210", "D212", "D300", "D400", "D402",
    "D403", "D405", "D407", "D414", "D415", "D417",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Preserve generated revision headers without weakening their existing lint rules.
"alembic/versions/*.py" = ["D"]

[tool.ruff.format]
# Historical migration revisions are immutable; do not rewrite generated files.
exclude = ["alembic/versions/**"]
