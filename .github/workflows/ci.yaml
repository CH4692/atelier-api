name: Attelier CI

on:
  pull_request:
    branches:
      - main

jobs:
  package-installation:
    name: Wheel installation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Build package
        run: uv build

      - name: Install wheel in a clean environment
        run: |
          uv venv "$RUNNER_TEMP/atelier-package-test" --python "$(cat .python-version)"
          uv pip install --python "$RUNNER_TEMP/atelier-package-test/bin/python" dist/*.whl

      - name: Verify installed application outside the repository
        env:
          DATABASE_URL: sqlite://
        run: |
          cp scripts/check_installed_package.py "$RUNNER_TEMP/check_installed_package.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/atelier-package-test/bin/python" -I check_installed_package.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install project
        run: uv sync --locked --dev

      - name: Run Lint
        run: make lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install project
        run: uv sync --locked --dev

      - name: Run Typecheck
        run: make typecheck

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atelier
          POSTGRES_PASSWORD: atelier_test
          POSTGRES_DB: atelier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atelier -d atelier_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://atelier:atelier_test@localhost:5432/atelier_test
      TEST_DATABASE_URL: postgresql+psycopg://atelier:atelier_test@localhost:5432/atelier_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install project
        run: uv sync --locked --dev

      - name: Apply database migrations
        run: make db-migrate

      - name: Run unit and configuration tests
        run: uv run pytest --ignore=tests/integration

      - name: Run PostgreSQL integration tests
        run: uv run pytest tests/integration -v

  migrations:
    name: Database Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atelier
          POSTGRES_PASSWORD: atelier_test
          POSTGRES_DB: atelier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atelier -d atelier_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://atelier:atelier_test@localhost:5432/atelier_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install project
        run: uv sync --locked --dev

      - name: Apply database migrations
        run: make db-migrate

      - name: Check database model consistency
        run: make db-check
